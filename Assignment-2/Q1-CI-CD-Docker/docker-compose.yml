services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: college-erp-q1
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s