name: College ERP CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'Assignment-1/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Assignment-1/**'
      - '.github/workflows/ci-cd.yml'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Verify application files
        run: |
          echo "Checking College ERP application..."
          test -f Assignment-1/Q2-Git-GitHub/college-erp/index.html
          echo "Application files verified successfully."

  test:
    name: Test Application
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Run application tests
        run: |
          echo "Running College ERP tests..."
          test -f Assignment-1/Q2-Git-GitHub/college-erp/index.html
          grep -q "<html" Assignment-1/Q2-Git-GitHub/college-erp/index.html
          grep -q "College ERP" Assignment-1/Q2-Git-GitHub/college-erp/index.html
          echo "All tests passed."

  package:
    name: Package Application
    runs-on: ubuntu-24.04
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Create deployment package
        run: |
          mkdir package
          cp Assignment-1/Q2-Git-GitHub/college-erp/index.html package/
          echo "Application packaged successfully."

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: college-erp-package
          path: package/

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    needs: package

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: Assignment-1/Q2-Git-GitHub/college-erp

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5