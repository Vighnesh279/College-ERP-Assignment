name: Assignment 2 Q1 - CI-CD Docker Compose

on:
  push:
    branches:
      - main
    paths:
      - 'Assignment-2/Q1-CI-CD-Docker/**'
      - '.github/workflows/assignment2-q1-ci-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Assignment-2/Q1-CI-CD-Docker/**'
      - '.github/workflows/assignment2-q1-ci-cd.yml'

permissions:
  contents: read

jobs:
  build-test-deploy:
    name: Build, Test and Deploy with Docker Compose
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Assignment-2/Q1-CI-CD-Docker

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t college-erp-q1:${{ github.sha }} .

      - name: Deploy using Docker Compose
        run: docker compose up --build -d

      - name: Verify deployed application
        run: |
          echo "Waiting for the application container to become healthy..."
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' college-erp-q1 2>/dev/null || true)
            echo "Attempt ${attempt}: ${status:-not available}"
            if [ "$status" = "healthy" ]; then
              break
            fi
            sleep 2
          done

          docker compose ps
          status=$(docker inspect --format='{{.State.Health.Status}}' college-erp-q1)
          test "$status" = "healthy"

          curl --fail --show-error --retry 5 --retry-all-errors --retry-delay 2 http://127.0.0.1:5000/health

      - name: Show deployment logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color web || true

      - name: Stop deployment
        if: always()
        run: docker compose down --remove-orphans